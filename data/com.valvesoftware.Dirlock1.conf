<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Copyright © 2026 Valve Corporation.
  SPDX-License-Identifier: BSD-3-Clause

  System bus policy for dirlockd.

  The interface is restricted to root for now, as all methods are
  privileged operations. Signal reception is restricted too.
-->

<busconfig>

  <policy user="root">
    <allow own="com.valvesoftware.Dirlock1"/>
    <allow send_destination="com.valvesoftware.Dirlock1"/>
    <allow receive_sender="com.valvesoftware.Dirlock1"/>
  </policy>

  <policy context="default">
    <deny own="com.valvesoftware.Dirlock1"/>
    <deny send_destination="com.valvesoftware.Dirlock1"/>
    <deny receive_sender="com.valvesoftware.Dirlock1"/>
  </policy>

</busconfig>
